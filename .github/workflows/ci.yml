name: MicroDeploy CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/amenmnx/microdeploy-api
  WORKER_IMAGE: ghcr.io/amenmnx/microdeploy-worker

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest httpx ruff

      - name: Lint API
        run: ruff check api --ignore E501

      - name: Run API tests
        working-directory: api
        run: pytest -q

      - name: Install Worker dependencies
        run: |
          pip install -r worker/requirements.txt
          pip install pytest ruff

      - name: Lint Worker
        run: ruff check worker --ignore E501

      - name: Run Worker tests
        working-directory: worker
        run: pytest -q

  build-scan-push:
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: docker build -t ${{ env.API_IMAGE }}:${{ github.sha }} ./api

      - name: Build Worker image
        run: docker build -t ${{ env.WORKER_IMAGE }}:${{ github.sha }} ./worker

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.API_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan Worker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Tag images as latest
        run: |
          docker tag ${{ env.API_IMAGE }}:${{ github.sha }} ${{ env.API_IMAGE }}:latest
          docker tag ${{ env.WORKER_IMAGE }}:${{ github.sha }} ${{ env.WORKER_IMAGE }}:latest

      - name: Push API images
        run: |
          docker push ${{ env.API_IMAGE }}:${{ github.sha }}
          docker push ${{ env.API_IMAGE }}:latest

      - name: Push Worker images
        run: |
          docker push ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.WORKER_IMAGE }}:latest