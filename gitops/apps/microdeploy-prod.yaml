# -----------------------------------------------------------------------------
# microdeploy-prod — ArgoCD Application for the prod overlay
# Shares the `microdeploy` namespace with dev (see comment in
# gitops/manifests/prod/kustomization.yaml for why — single local cluster,
# and it avoids the SealedSecret nested-namespace rewrite bug).
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microdeploy-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/amenMNX/MicroDeploy.git
    targetRevision: main
    path: gitops/manifests/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: microdeploy

  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true    # fix manual kubectl changes back to Git state
    syncOptions:
      - CreateNamespace=false
