apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microdeploy-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/amenMNX/MicroDeploy.git
    targetRevision: main
    path: gitops/manifests/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: microdeploy

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false