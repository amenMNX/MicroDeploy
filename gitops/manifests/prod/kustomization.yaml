# -----------------------------------------------------------------------------
# Prod overlay -- builds on base, 2 API replicas, tracks pinned release tags
# Own namespace (microdeploy-prod) so prod has its own real Postgres
# instance/PVC/data, fully separate from dev. The one resource Kustomize's
# namespace transformer can't rewrite automatically is the nested
# spec.template.metadata.namespace inside sealed-secret.yaml (a SealedSecret
# CRD quirk) -- prod/sealed-secret.yaml below is a prod-specific SealedSecret,
# re-encrypted for this namespace with kubeseal, replacing base's copy.
# -----------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microdeploy-prod

resources:
  - ../base
  - namespace.yaml
  - sealed-secret.yaml    # prod-specific, re-sealed for microdeploy-prod
                          # NOT YET CREATED -- must be generated with a real
                          # kubeseal run against the live cluster (the
                          # ciphertext is bound to namespace+name, so dev's
                          # file cannot simply be copied/renamed). See below.

images:
  # TEMP: pinned to a known-good commit SHA that's actually been built and
  # pushed by CI. "v1.0.0" doesn't exist yet -- CI only pushes SHA tags
  # right now, there's no release/tagging step. Swap this for a real
  # version tag once that process exists.
  - name: ghcr.io/amenmnx/microdeploy-api
    newTag: "ee59aab1dbc5a86035fb714a06c76eb1e3f64ba4"
  - name: ghcr.io/amenmnx/microdeploy-worker
    newTag: "ee59aab1dbc5a86035fb714a06c76eb1e3f64ba4"

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: microdeploy-api