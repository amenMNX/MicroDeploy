# -----------------------------------------------------------------------------
# Dev overlay -- builds on base, 1 API replica, lower resource limits
# -----------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microdeploy
resources:
  - ../base
  - namespace.yaml
  - sealed-secret.yaml
images:
  - name: ghcr.io/amenmnx/microdeploy-api
    newTag: d82b53c511dc6c1c023ac51bced4f8cf43901d87
  - name: ghcr.io/amenmnx/microdeploy-worker
    newTag: d82b53c511dc6c1c023ac51bced4f8cf43901d87
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: microdeploy-api
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "300m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "192Mi"
    target:
      kind: Deployment
      name: microdeploy-api
